databases:
  - name: zerodha-ai-db
    plan: free            # upgrade for production (free DBs expire on Render)
    databaseName: zerodha_ai
    user: zerodha

services:
  - type: web
    name: zerodha-ai-platform-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zerodha-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false        # set to your Vercel/Netlify frontend URL
      - key: GEMINI_API_KEY
        sync: false
